AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Protec API - Lambda + API Gateway HTTP API
# Parâmetros vêm do AWS SSM Parameter Store (prefixo /protec-api/). Execute infra/setup-ssm.sh uma vez.

Globals:
  Function:
    Timeout: 120
    MemorySize: 1024
    Runtime: nodejs20.x

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: ../apps/api/dist-lambda
      Events:
        RootRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        ProxyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
      Environment:
        Variables:
          NODE_ENV: production
          DATABASE_URL: !Sub '{{resolve:ssm:/protec-api/DATABASE_URL}}'
          JWT_SECRET: !Sub '{{resolve:ssm:/protec-api/JWT_SECRET}}'
          REFRESH_TOKEN_SECRET: !Sub '{{resolve:ssm:/protec-api/REFRESH_TOKEN_SECRET}}'
          CORS_ORIGIN: !Sub '{{resolve:ssm:/protec-api/CORS_ORIGIN}}'
          CORS_ORIGIN_DOMAINS: !Sub '{{resolve:ssm:/protec-api/CORS_ORIGIN_DOMAINS}}'
          SUPABASE_URL: !Sub '{{resolve:ssm:/protec-api/SUPABASE_URL}}'
          SUPABASE_SERVICE_KEY: !Sub '{{resolve:ssm:/protec-api/SUPABASE_SERVICE_KEY}}'
          SUPABASE_ANON_KEY: !Sub '{{resolve:ssm:/protec-api/SUPABASE_ANON_KEY}}'
          STRIPE_SECRET_KEY: !Sub '{{resolve:ssm:/protec-api/STRIPE_SECRET_KEY}}'
          STRIPE_WEBHOOK_SECRET: !Sub '{{resolve:ssm:/protec-api/STRIPE_WEBHOOK_SECRET}}'
          OPENAI_API_KEY: !Sub '{{resolve:ssm:/protec-api/OPENAI_API_KEY}}'
          FORCE_ALL_MODULES_ACTIVE: 'false'

Outputs:
  ApiUrl:
    Description: API Gateway HTTP API URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'
  ApiFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ApiFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ApiFunctionArn'
