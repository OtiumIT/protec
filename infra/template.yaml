AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Protec API - Lambda + API Gateway HTTP API
# Parâmetros vêm do AWS SSM Parameter Store (prefixo /protec-api/). Execute infra/setup-ssm.sh uma vez.

Globals:
  Function:
    Timeout: 120
    MemorySize: 1024
    Runtime: nodejs20.x

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # CORS no próprio API Gateway: garante Access-Control-Allow-Origin mesmo em
      # respostas que não passam pela Lambda (ex.: 503 por timeout de 29s do HTTP API).
      CorsConfiguration:
        AllowOrigins:
          - https://iataxsistemas.com.br
          - https://www.iataxsistemas.com.br
          - https://hml.iataxsistemas.com.br
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
          - PATCH
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Tenant-ID
        AllowCredentials: true
        MaxAge: 86400

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Tags:
        CORSRefresh: '2026-03-25'
      Handler: index.handler
      CodeUri: ../apps/api/dist-lambda
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*'
      Events:
        RootRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        ProxyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
      Environment:
        Variables:
          NODE_ENV: production
          # Evita esgotar o pooler Supabase em modo Session (MaxClientsInSessionMode)
          DATABASE_POOL_MAX: '1'
          DATABASE_URL: !Sub '{{resolve:ssm:/protec-api/DATABASE_URL}}'
          JWT_SECRET: !Sub '{{resolve:ssm:/protec-api/JWT_SECRET}}'
          REFRESH_TOKEN_SECRET: !Sub '{{resolve:ssm:/protec-api/REFRESH_TOKEN_SECRET}}'
          CORS_ORIGIN: !Sub '{{resolve:ssm:/protec-api/CORS_ORIGIN}}'
          CORS_ORIGIN_DOMAINS: !Sub '{{resolve:ssm:/protec-api/CORS_ORIGIN_DOMAINS}}'
          SUPABASE_URL: !Sub '{{resolve:ssm:/protec-api/SUPABASE_URL}}'
          SUPABASE_SERVICE_KEY: !Sub '{{resolve:ssm:/protec-api/SUPABASE_SERVICE_KEY}}'
          SUPABASE_ANON_KEY: !Sub '{{resolve:ssm:/protec-api/SUPABASE_ANON_KEY}}'
          STRIPE_SECRET_KEY: !Sub '{{resolve:ssm:/protec-api/STRIPE_SECRET_KEY}}'
          STRIPE_WEBHOOK_SECRET: !Sub '{{resolve:ssm:/protec-api/STRIPE_WEBHOOK_SECRET}}'
          OPENAI_API_KEY: !Sub '{{resolve:ssm:/protec-api/OPENAI_API_KEY}}'
          RESEND_API_KEY: !Sub '{{resolve:ssm:/protec-api/RESEND_API_KEY}}'
          APP_URL: !Sub '{{resolve:ssm:/protec-api/APP_URL}}'
          EMAIL_FROM: !Sub '{{resolve:ssm:/protec-api/EMAIL_FROM}}'
          ADMIN_FEEDBACK_EMAILS: !Sub '{{resolve:ssm:/protec-api/ADMIN_FEEDBACK_EMAILS}}'
          FORCE_ALL_MODULES_ACTIVE: 'false'

Outputs:
  ApiUrl:
    Description: API Gateway HTTP API URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'
  ApiFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ApiFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ApiFunctionArn'
