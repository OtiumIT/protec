AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Protec API - Lambda + API Gateway HTTP API

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection string (Supabase DATABASE_URL)
  JwtSecret:
    Type: String
    NoEcho: true
    Description: JWT secret key
  RefreshTokenSecret:
    Type: String
    NoEcho: true
    Description: Refresh token secret key
  CorsOrigin:
    Type: String
    Default: ''
    Description: CORS allowed origins (comma-separated), e.g. https://example.com
  CorsOriginDomains:
    Type: String
    Default: ''
    Description: CORS allowed domains (comma-separated), e.g. example.com
  SupabaseUrl:
    Type: String
    Description: Supabase project URL
  SupabaseServiceKey:
    Type: String
    NoEcho: true
    Description: Supabase service role key
  SupabaseAnonKey:
    Type: String
    NoEcho: true
    Description: Supabase anon key
  StripeSecretKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Stripe secret key (optional, for billing)
  StripeWebhookSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: Stripe webhook secret (optional, for billing)
  OpenaiApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: OpenAI API key (optional, for IRPF module)
  ForceAllModulesActive:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Force all modules active (dev/demo only)

Globals:
  Function:
    Timeout: 120
    MemorySize: 1024
    Runtime: nodejs20.x

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: ../apps/api/dist-lambda
      Events:
        RootRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        ProxyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
      Environment:
        Variables:
          NODE_ENV: production
          DATABASE_URL: !Ref DatabaseUrl
          JWT_SECRET: !Ref JwtSecret
          REFRESH_TOKEN_SECRET: !Ref RefreshTokenSecret
          CORS_ORIGIN: !Ref CorsOrigin
          CORS_ORIGIN_DOMAINS: !Ref CorsOriginDomains
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_KEY: !Ref SupabaseServiceKey
          SUPABASE_ANON_KEY: !Ref SupabaseAnonKey
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          OPENAI_API_KEY: !Ref OpenaiApiKey
          FORCE_ALL_MODULES_ACTIVE: !Ref ForceAllModulesActive

Outputs:
  ApiUrl:
    Description: API Gateway HTTP API URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'
  ApiFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ApiFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ApiFunctionArn'
