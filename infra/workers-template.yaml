AWSTemplateFormatVersion: '2010-09-09'
Description: Protec Python fiscal workers — ECS Fargate, ECR, VPC pública mínima (sem NAT). Segredos em SSM /protec-api/* (mesmo padrão da API Lambda).

Parameters:
  ImageTag:
    Type: String
    Default: latest
    Description: Tag da imagem no ECR (CI deve usar o SHA do commit ou latest após push).

  WorkerCpu:
    Type: String
    Default: '256'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
    Description: CPU Fargate (unidades).

  WorkerMemoryMiB:
    Type: String
    Default: '512'
    AllowedValues: ['512', '1024', '2048', '3072', '4096', '8192', '16384']
    Description: Memória da task (MiB), compatível com a CPU escolhida (validar na doc Fargate).

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 4
    Description: Número de tasks (1 recomendado no início).

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.201.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: protec-workers-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: protec-workers-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.201.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: protec-workers-public-a

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.201.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: protec-workers-public-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: protec-workers-public-rt

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # EC2 GroupDescription must be ASCII-only (no em-dash or accented chars).
      GroupDescription: ECS fiscal worker outbound HTTPS and Postgres
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Outbound for Supabase and Postgres

  WorkerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: protec-worker
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Manter no maximo 20 imagens",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: protec-workers
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/protec-workers
      RetentionInDays: 30

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SsmReadProtecApiParams
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: GetWorkerParams
                Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/protec-api/*

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: protec-workers
      Cpu: !Ref WorkerCpu
      Memory: !Ref WorkerMemoryMiB
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: fiscal-worker
          Essential: true
          Image: !Sub
            - '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Repo}:${Tag}'
            - Repo: !Ref WorkerRepository
              Tag: !Ref ImageTag
          Command:
            - python
            - src/main.py
            - --loop
            - --sleep-seconds
            - '15'
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/protec-api/DATABASE_URL
            - Name: SUPABASE_URL
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/protec-api/SUPABASE_URL
            - Name: SUPABASE_SERVICE_KEY
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/protec-api/SUPABASE_SERVICE_KEY
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: fiscal-worker

  WorkerService:
    Type: AWS::ECS::Service
    DependsOn:
      - WorkerTaskDefinition
    Properties:
      ServiceName: protec-workers
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !GetAtt WorkerSecurityGroup.GroupId
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100

Outputs:
  EcrRepositoryUri:
    Description: URI do repositório ECR (docker tag/push)
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${WorkerRepository}'
    Export:
      Name: !Sub '${AWS::StackName}-EcrRepositoryUri'

  ClusterName:
    Description: Nome do cluster ECS
    Value: !Ref ECSCluster

  ServiceName:
    Description: Nome do serviço ECS
    Value: protec-workers

  VpcId:
    Description: VPC dedicada aos workers
    Value: !Ref VPC
