name: Template Sync Check

# Este workflow verifica se o repositório está sincronizado com o template
# Útil para manter projetos filhos atualizados

on:
  schedule:
    # Roda semanalmente
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check if behind template
        run: |
          echo "Este workflow verifica se há atualizações no template."
          echo "Para sincronizar manualmente, veja TEMPLATE.md"
          echo "Template: https://github.com/SEU_USUARIO/ProjetoBase"
