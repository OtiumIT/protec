# Deploy API para AWS Lambda
# Pré-requisitos: configurar OIDC na AWS e secrets no GitHub (ver docs/DEPLOY_LAMBDA.md)

name: Deploy API Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Lambda bundle
        run: pnpm run build:lambda

      - name: Setup SAM CLI
        run: |
          pip install aws-sam-cli
          sam --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # ARN fixo da role (não é secreto; segurança está na trust policy na AWS)
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN || vars.AWS_OIDC_ROLE_ARN || 'arn:aws:iam::688123783562:role/iatax_github' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: SAM Build
        run: sam build -t infra/template.yaml

      - name: SAM Deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name protec-api \
            --capabilities CAPABILITY_IAM \
            --resolve-s3
