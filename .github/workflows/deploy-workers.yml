# Deploy workers Python (ECS Fargate + ECR). Pré-requisitos: SSM /protec-api/* e IAM OIDC (ver docs/DEPLOY_WORKERS.md).

name: Deploy Workers ECS

on:
  push:
    branches:
      - main
    paths:
      - 'apps/workers/**'
      - 'infra/workers-template.yaml'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      STACK_NAME: protec-workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN || vars.AWS_OIDC_ROLE_ARN || 'arn:aws:iam::688123783562:role/iatax_github' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # ROLLBACK_* precisa de delete; DELETE_FAILED exige IAM extra ou exclusão manual na console.
      - name: Remover stack protec-workers se estiver em falha
        run: |
          set +e
          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].StackStatus' --output text 2>/dev/null)
          RC=$?
          set -e
          if [ "$RC" -ne 0 ] || [ -z "$STATUS" ] || [ "$STATUS" = "None" ]; then
            echo "Stack $STACK_NAME não existe ou não consultável — seguindo."
            exit 0
          fi
          echo "Status atual: $STATUS"

          if [ "$STATUS" = "DELETE_FAILED" ]; then
            echo "::error::Stack em DELETE_FAILED: a AWS não apagou um recurso (ex.: roles IAM sem permissão iam:DeleteRole na role OIDC)."
            aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --region "$AWS_REGION" \
              --query 'StackEvents[?contains(ResourceStatus, `FAILED`)].[LogicalResourceId,ResourceStatus,ResourceStatusReason]' --output table || true
            echo "Ação: conceda iam:DeleteRole, iam:DeleteRolePolicy, iam:DetachRolePolicy à role OIDC ou exclua a stack com usuário admin. Ver docs/DEPLOY_WORKERS.md"
            exit 1
          fi

          case "$STATUS" in
            ROLLBACK_FAILED|CREATE_FAILED|UPDATE_ROLLBACK_FAILED|UPDATE_FAILED|ROLLBACK_COMPLETE)
              echo "::warning::Removendo stack em estado $STATUS para permitir novo deploy"
              aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "$AWS_REGION"
              echo "Aguardando exclusão (pode levar vários minutos)..."
              set +e
              aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" --region "$AWS_REGION"
              WAIT_RC=$?
              set -e
              if [ "$WAIT_RC" -eq 0 ]; then
                echo "Stack removida."
                exit 0
              fi
              if ! aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" &>/dev/null; then
                echo "Stack não existe mais (ok)."
                exit 0
              fi
              FINAL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].StackStatus' --output text)
              echo "::error::Exclusão não concluiu. Status: $FINAL"
              aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --region "$AWS_REGION" \
                --query 'StackEvents[?contains(ResourceStatus, `FAILED`)].[LogicalResourceId,ResourceStatus,ResourceStatusReason]' --output table || true
              echo "Se o status for DELETE_FAILED: IAM (delete role) ou exclusão manual na console. docs/DEPLOY_WORKERS.md"
              exit 1
              ;;
            *)
              echo "Stack em estado utilizável ($STATUS) — não removendo."
              ;;
          esac

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infra/workers-template.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides "ImageTag=${GITHUB_SHA}" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset

      - name: Get ECR repository URI
        id: ecr
        run: |
          URI=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`EcrRepositoryUri`].OutputValue' --output text)
          echo "uri=$URI" >> "$GITHUB_OUTPUT"
          echo "ECR URI: $URI"

      - name: Login to ECR
        run: |
          URI="${{ steps.ecr.outputs.uri }}"
          REGISTRY="${URI%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build and push image
        run: |
          IMAGE="${{ steps.ecr.outputs.uri }}:${GITHUB_SHA}"
          docker build -t "$IMAGE" -f apps/workers/Dockerfile apps/workers
          docker push "$IMAGE"
          echo "Pushed $IMAGE"

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster protec-workers \
            --service protec-workers \
            --region "$AWS_REGION" \
            --force-new-deployment \
            --no-cli-pager
