# Deploy workers Python via SSM para EC2 (t3a.nano).
# Pré-requisitos: instância EC2 com tag Name=protec-worker, SSM Agent, /protec-api/* no SSM.
# Role OIDC precisa de ssm:SendCommand, ssm:GetCommandInvocation, ec2:DescribeInstances.

name: Deploy Workers EC2

on:
  push:
    branches:
      - main
    paths:
      - 'apps/workers/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

concurrency:
  group: workers-ec2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      INSTANCE_TAG: protec-worker
      DEPLOY_BUCKET: protec-worker-deploy-688123783562
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN || vars.AWS_OIDC_ROLE_ARN || 'arn:aws:iam::688123783562:role/iatax_github' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Find worker instance ID
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_TAG" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text --region "$AWS_REGION")
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::Nenhuma instancia EC2 com tag Name=$INSTANCE_TAG em estado running."
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Instance: $INSTANCE_ID"

      - name: Upload worker code to S3
        run: |
          tar czf /tmp/workers.tar.gz -C apps/workers .
          aws s3 cp /tmp/workers.tar.gz "s3://$DEPLOY_BUCKET/workers.tar.gz" --region "$AWS_REGION"
          echo "Uploaded workers.tar.gz to s3://$DEPLOY_BUCKET/"

      - name: Deploy via SSM
        run: |
          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 120 \
            --parameters '{"commands":["set -e","aws s3 cp s3://'"$DEPLOY_BUCKET"'/workers.tar.gz /tmp/workers.tar.gz --region '"$AWS_REGION"'","mkdir -p /opt/protec-workers/src","tar xzf /tmp/workers.tar.gz -C /opt/protec-workers/","rm -f /tmp/workers.tar.gz","python3.12 -m pip install --break-system-packages -q -r /opt/protec-workers/requirements.txt 2>/dev/null || python3.12 -m pip install -q -r /opt/protec-workers/requirements.txt","cp /opt/protec-workers/protec-worker.service /etc/systemd/system/protec-worker.service","systemctl daemon-reload","systemctl restart protec-worker","sleep 3","systemctl is-active protec-worker"]}' \
            --region "$AWS_REGION" \
            --query Command.CommandId --output text)
          echo "SSM Command: $CMD_ID"

          for i in $(seq 1 24); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query Status --output text 2>/dev/null || echo "Pending")
            echo "[$i] Status: $STATUS"
            case "$STATUS" in
              Success)
                echo "Deploy concluido com sucesso."
                exit 0
                ;;
              Failed|TimedOut|Cancelled)
                echo "::error::SSM command falhou: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query '[StandardOutputContent,StandardErrorContent]' --output text || true
                exit 1
                ;;
            esac
          done
          echo "::error::Timeout aguardando SSM command."
          exit 1
