# Render Blueprint – API (backend) do monorepo
# O banco é externo (Supabase). Configure DATABASE_URL e demais variáveis no Dashboard.
services:
  - type: web
    name: api
    runtime: node
    region: oregon

    # Monorepo: build APENAS API (shared + api), evita portal/workers = build mais rápido
    # Render não tem pnpm por padrão; instalar globalmente antes do build
    buildCommand: npm install -g pnpm@8 && pnpm install --frozen-lockfile && pnpm run build:api
    startCommand: cd apps/api && node dist/index.js

    # Só dispara deploy quando API ou shared mudam (não em mudanças só no portal)
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package.json
        - pnpm-lock.yaml
        - turbo.json

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FORCE_ALL_MODULES_ACTIVE
        value: 'true'
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
